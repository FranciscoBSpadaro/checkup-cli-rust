# checkup.toml — Environment diagnostics config
# Docs: https://github.com/FranciscoBSpadaro/checkup-cli-rust

[commands]
# Verifica se comandos estao disponiveis no PATH
# [commands.<name>] — name sera usado como label

[commands.git]
command = "git"
fix = "sudo apt install git"

[commands.rustc]
command = "rustc"
fix = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"

[commands.cargo]
command = "cargo"
fix = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"

[commands.node]
command = "node"
fix = "fnm install 20"

# Verifica versoes minimas
# [versions.<tool_name>]
# version_flag = "--version"
# expected = ">=X.Y"

[versions.rust]
version_flag = "--version"
expected = ">=1.75"
fix = "rustup update"

[versions.node]
version_flag = "--version"
expected = ">=20"
fix = "fnm install 20"

# Verifica servicos (conecta na porta TCP)
# [services.<name>]
# port = 5432
# host = "127.0.0.1"

[services.postgres]
port = 5432
host = "127.0.0.1"

[services.redis]
port = 6379
host = "127.0.0.1"

[services.mongo]
port = 27017
host = "127.0.0.1"

# Portas que devem estar livres
[ports]
free = [3000, 5432, 6379, 8080]

# Variaveis de ambiente obrigatorias
[env]
required = ["HOME", "PATH"]

# Arquivo .env
[envfile]
path = ".env"
required = ["DATABASE_URL", "API_KEY"]
