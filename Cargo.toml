[package]
name = "checkup"
version = "0.1.1"
edition = "2021"
authors = ["FBS-DEV <fbs-dev-pro@proton.me>"]
description = "Environment diagnostics and auto-fix for development machines"
license = "MIT"
repository = "https://github.com/FranciscoBSpadaro/checkup-cli-rust"
keywords = ["cli", "devtools", "environment", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
colored = "2"
thiserror = "1"
anyhow = "1"
which = "6"
async-trait = "0.1"
indicatif = "0.17"
serde_json = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
